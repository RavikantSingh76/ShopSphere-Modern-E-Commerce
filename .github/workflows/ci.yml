name: ShopSphere CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Test & Package (Spring Boot 3 + JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x server/mvnw

      - name: Run Backend Automated Tests
        working-directory: ./server
        run: ./mvnw clean test --no-transfer-progress

      - name: Package Backend JAR
        working-directory: ./server
        run: ./mvnw package -DskipTests --no-transfer-progress

  frontend-build:
    name: Frontend Build & Verification (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./client
        run: npm run build
