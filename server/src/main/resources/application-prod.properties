# Production Profile Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Production Database (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:ecommerce_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:ecommerce_user}
spring.datasource.password=${DB_PASSWORD}

# Flyway Schema Management
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Hibernate Schema Validation (Flyway manages schema, Hibernate strictly validates)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Security & Console - H2 explicitly disabled in production
spring.h2.console.enabled=false

# Performance & HikariCP Connection Pooling
# 15 connections comfortably handles ~100-200 concurrent HTTP requests with sub-50ms query times
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Production Cache Configuration (Redis with TTL & graceful fallback)
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:true}

# Storage Configuration
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.upload-dir=uploads/products
app.storage.s3.bucket=${STORAGE_BUCKET:}
app.storage.s3.region=${STORAGE_REGION:us-east-1}
app.storage.s3.endpoint=${STORAGE_ENDPOINT:}
app.storage.s3.access-key=${STORAGE_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_SECRET_KEY:}
app.storage.cdn-url=${STORAGE_CDN_URL:}

# Logging Pattern with Correlation ID (MDC)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n

# Seeding disabled in Production; default demo accounts are NOT created unless explicitly configured via env
app.seed-sample-data=false
app.demo.admin-email=${DEMO_ADMIN_EMAIL:}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.customer-email=${DEMO_CUSTOMER_EMAIL:}
app.demo.customer-password=${DEMO_CUSTOMER_PASSWORD:}
app.demo.manager-email=${DEMO_MANAGER_EMAIL:}
app.demo.manager-password=${DEMO_MANAGER_PASSWORD:}
app.demo.vendor-email=${DEMO_VENDOR_EMAIL:}
app.demo.vendor-password=${DEMO_VENDOR_PASSWORD:}

