# Development Profile Configuration
server.port=${SERVER_PORT:8080}

# H2 In-Memory/File Database for rapid local testing
spring.datasource.url=jdbc:h2:file:./data/ecommercedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

app.seed-sample-data=false
app.demo.admin-email=${DEMO_ADMIN_EMAIL:ravikantsinghravi366@gmail.com}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.customer-email=${DEMO_CUSTOMER_EMAIL:customer@ecommerce.com}
app.demo.customer-password=${DEMO_CUSTOMER_PASSWORD:}
app.demo.manager-email=${DEMO_MANAGER_EMAIL:manager.ravi@ecommerce.com}
app.demo.manager-password=${DEMO_MANAGER_PASSWORD:}
app.demo.vendor-email=${DEMO_VENDOR_EMAIL:vendor.ravi@ecommerce.com}
