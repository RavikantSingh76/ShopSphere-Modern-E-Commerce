# Server Configuration
server.port=8080
server.servlet.context-path=

# Application Name
spring.application.name=EcommerceStoreBackend

# Common JPA / Hibernate Config
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Default Dev Database (H2 file storage for instant zero-configuration start + console)
spring.datasource.url=jdbc:h2:file:./data/ecommercedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Razorpay Payment Gateway Configuration (LIVE Production Keys)
app.razorpay.key-id=rzp_live_TaBVwbfDRE5yH4
app.razorpay.key-secret=elqofWGqkxF6CfNzOZuxlmwM
app.razorpay.currency=INR
app.razorpay.company-name=ShopSphere

# Disable auto-seeding of sample/random dummy products and data
app.seed-sample-data=false
