# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=

# Application Name
spring.application.name=EcommerceStoreBackend

# Common JPA / Hibernate Config
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration (Overridable via JWT_SECRET env var)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Default Dev Database (H2 file storage for instant zero-configuration start + console)
spring.datasource.url=jdbc:h2:file:./data/ecommercedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.sql.init.mode=never

# Flyway Database Migration (disabled for local H2 file mode; enabled in mysql/prod profiles)
spring.flyway.enabled=false

# Razorpay Payment Gateway Configuration (Environment-driven, no committed secrets)
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.currency=${RAZORPAY_CURRENCY:INR}
app.razorpay.company-name=${RAZORPAY_COMPANY_NAME:ShopSphere}

# Disable auto-seeding of sample/random dummy products and data
app.seed-sample-data=false

# Default In-Memory Cache (Simple) for standalone dev
spring.cache.type=simple

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false

# Storage Configuration (local default; S3-compatible configurable)
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.upload-dir=uploads/products
app.storage.s3.bucket=${STORAGE_BUCKET:}
app.storage.s3.region=${STORAGE_REGION:us-east-1}
app.storage.s3.endpoint=${STORAGE_ENDPOINT:}
app.storage.s3.access-key=${STORAGE_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_SECRET_KEY:}
app.storage.cdn-url=${STORAGE_CDN_URL:}
